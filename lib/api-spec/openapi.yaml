                    items: { type: string }
                  expectedExamReadiness: { type: string }
                  revisionAdvice: { type: string }
                  dailySummary: { type: string }
                  weeklySummary: { type: string }

components:
  schemas:
    GamificationConfig:
      type: object
      properties:
        id: { type: number }
        dailyLoginXp: { type: number }
        solveQuestionXp: { type: number }
        readArticleXp: { type: number }
        completeMissionXp: { type: number }
        perfectAccuracyXp: { type: number }
      required: [dailyLoginXp, solveQuestionXp, readArticleXp, completeMissionXp, perfectAccuracyXp]

    UpdateGamificationConfigInput:
      type: object
      properties:
        dailyLoginXp: { type: number }
        solveQuestionXp: { type: number }
        readArticleXp: { type: number }
        completeMissionXp: { type: number }
        perfectAccuracyXp: { type: number }
      required: [dailyLoginXp, solveQuestionXp, readArticleXp, completeMissionXp, perfectAccuracyXp]

    UpdateGoalsInput:
      type: object
      properties:
        dailyQuestions: { type: number }
        weeklyQuestions: { type: number }
        monthlyQuestions: { type: number }
        dailyMinutes: { type: number }
        dailyHours: { type: number }
        practiceAccuracy: { type: number }
        targetExam: { type: string }
        targetScore: { type: number }
        targetAccuracy: { type: number }
      required: [dailyQuestions, weeklyQuestions, monthlyQuestions, dailyMinutes, dailyHours, practiceAccuracy, targetExam, targetScore, targetAccuracy]

    CreateStudyTaskInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        category: { type: string }
        priority: { type: string }
        durationMinutes: { type: number }
        date: { type: string }
      required: [title, date]

    UpdateStudyTaskInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        category: { type: string }
        priority: { type: string }
        durationMinutes: { type: number }
        completed: { type: boolean }
        date: { type: string }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # ─── Auth ─────────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        password:
          type: string
          minLength: 8
        phone:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [student, admin, super_admin]
        status:
          type: string
          enum: [active, suspended]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        rank:
          type: ["number", "null"]
        totalScore:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    UserDetail:
      type: object
      required: [id, name, email, role, status, createdAt, stats]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [student, admin, super_admin]
        status:
          type: string
          enum: [active, suspended]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        rank:
          type: ["number", "null"]
        totalScore:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        stats:
          $ref: "#/components/schemas/DashboardStats"

    UserUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended]
        role:
          type: string
          enum: [student, admin, super_admin]
        name:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]

    UserListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    # ─── Dashboard ────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalTestsTaken, averageScore, overallAccuracy, currentRank, totalStudyTime, testsThisWeek, weakSubjectsCount, strongSubjectsCount]
      properties:
        totalTestsTaken:
          type: number
        averageScore:
          type: number
        overallAccuracy:
          type: number
        currentRank:
          type: ["number", "null"]
        totalStudyTime:
          type: number
          description: Minutes
        testsThisWeek:
          type: number
        weakSubjectsCount:
          type: number
        strongSubjectsCount:
          type: number

    UpcomingTest:
      type: object
      required: [id, title, type, scheduledAt, durationMinutes, questionCount]
      properties:
        id:
          type: number
        title:
          type: string
        type:
          type: string
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        durationMinutes:
          type: number
        questionCount:
          type: number
        categoryName:
          type: ["string", "null"]

    ActivityItem:
      type: object
      required: [id, examTitle, score, totalMarks, accuracy, attemptedAt]
      properties:
        id:
          type: number
        examTitle:
          type: string
        score:
          type: number
        totalMarks:
          type: number
        accuracy:
          type: number
        rank:
          type: ["number", "null"]
        attemptedAt:
          type: string
          format: date-time

    SubjectPerformance:
      type: object
      required: [subjectId, subjectName, accuracy, totalAttempted, correct, incorrect, skipped]
      properties:
        subjectId:
          type: number
        subjectName:
          type: string
        accuracy:
          type: number
        totalAttempted:
          type: number
        correct:
          type: number
        incorrect:
          type: number
        skipped:
          type: number

    # ─── Exam Categories ──────────────────────────────────────────────────────
    ExamCategory:
      type: object
      required: [id, name, slug, examCount]
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        iconUrl:
          type: ["string", "null"]
        examCount:
          type: number

    ExamCategoryInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        iconUrl:
          type: ["string", "null"]

    # ─── Exams ────────────────────────────────────────────────────────────────
    Exam:
      type: object
      required: [id, title, type, status, durationMinutes, totalMarks, totalQuestions, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: string
          enum: [full_mock, mini_mock, topic_test, chapter_test, daily_quiz, weekly_quiz, pyq, sectional]
        status:
          type: string
          enum: [draft, published, archived]
        durationMinutes:
          type: number
        totalMarks:
          type: number
        totalQuestions:
          type: number
        positiveMarks:
          type: number
        negativeMarks:
          type: number
        categoryId:
          type: ["number", "null"]
        categoryName:
          type: ["string", "null"]
        attemptCount:
          type: number
        averageScore:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    ExamDetail:
      type: object
      required: [id, title, type, status, durationMinutes, totalMarks, totalQuestions, sections, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: string
        status:
          type: string
        durationMinutes:
          type: number
        totalMarks:
          type: number
        totalQuestions:
          type: number
        positiveMarks:
          type: number
        negativeMarks:
          type: number
        categoryId:
          type: ["number", "null"]
        categoryName:
          type: ["string", "null"]
        attemptCount:
          type: number
        averageScore:
          type: ["number", "null"]
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ExamSection"
        createdAt:
          type: string
          format: date-time

    ExamSection:
      type: object
      required: [id, name, questionCount, durationMinutes, order]
      properties:
        id:
          type: number
        name:
          type: string
        questionCount:
          type: number
        durationMinutes:
          type: ["number", "null"]
        order:
          type: number
        subjectId:
          type: ["number", "null"]
        isMandatory:
          type: boolean
        positiveMarks:
          type: ["number", "null"]
        negativeMarks:
          type: ["number", "null"]
        navigationRule:
          type: string
          enum: [free, lock_previous, sequential]
        autoMove:
          type: boolean

    ExamInput:
      type: object
      required: [title, type, durationMinutes, totalMarks, positiveMarks, negativeMarks]
      properties:
        title:
          type: string
        description:

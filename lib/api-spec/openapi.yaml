                    speed: { type: number }
                    attempts: { type: number }
                    hours: { type: number }
                    revision: { type: number }
                    currentAffairs: { type: number }
                    mockTests: { type: number }
                    adaptiveMastery: { type: number }

  /v1/analytics/ai-insights:
    get:
      operationId: getAiInsights

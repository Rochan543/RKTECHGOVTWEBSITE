          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: number }
                    userId: { type: number }
                    title: { type: string }
                    description: { type: ["string", "null"] }
                    category: { type: string }
                    priority: { type: string }
                    durationMinutes: { type: number }
                    completed: { type: boolean }
                    date: { type: string }
    post:
      operationId: createStudyTask
      tags: [dashboard]
      summary: Create a study task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyTaskInput"
      responses:
        "200":
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:

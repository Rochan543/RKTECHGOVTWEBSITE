      operationId: deleteStudyTask
      tags: [dashboard]
      summary: Delete study task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /v1/analytics/timeline:
    get:
      operationId: getTimelineAnalytics

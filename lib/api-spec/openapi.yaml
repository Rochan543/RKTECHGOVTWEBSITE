openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: SSC Exam Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: dashboard
    description: Dashboard & analytics
  - name: exams
    description: Exam management
  - name: questions
    description: Question management
  - name: subjects
    description: Subject management
  - name: topics
    description: Topic management
  - name: sessions
    description: Exam session (live exam engine)
  - name: results
    description: Exam results & analytics
  - name: users
    description: User management (admin)
  - name: leaderboard
    description: Leaderboard
  - name: notifications
    description: Notifications
  - name: notes
    description: Study notes & PDFs
  - name: categories
    description: Exam categories
  - name: collections
    description: Question collections management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ────────────────────────────────────────────────────────────────────
  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Dashboard ───────────────────────────────────────────────────────────────
  /v1/dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics for current user
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /v1/dashboard/upcoming-tests:
    get:
      operationId: getUpcomingTests
      tags: [dashboard]
      summary: Get upcoming scheduled tests
      responses:
        "200":
          description: Upcoming tests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingTest"

  /v1/dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent exam activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /v1/dashboard/subject-performance:
    get:
      operationId: getSubjectPerformance
      tags: [dashboard]
      summary: Get subject-wise accuracy for the current user
      responses:
        "200":
          description: Subject performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectPerformance"

  # ─── Exam Categories ─────────────────────────────────────────────────────────
  /v1/exam-categories:
    get:
      operationId: listExamCategories
      tags: [categories]
      summary: List all exam categories (SSC, Banking, etc.)
      responses:
        "200":
          description: Exam categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExamCategory"
    post:
      operationId: createExamCategory
      tags: [categories]
      summary: Create exam category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamCategory"

  # ─── Exams ───────────────────────────────────────────────────────────────────
  /v1/exams:
    get:
      operationId: listExams
      tags: [exams]
      summary: List exams with optional filters
      parameters:
        - name: categoryId
          in: query
          schema:
            type: ["number", "null"]
        - name: type
          in: query
          schema:
            type: ["string", "null"]
            enum: [full_mock, mini_mock, topic_test, chapter_test, daily_quiz, weekly_quiz, pyq, sectional, null]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: [draft, published, archived, null]
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: Paginated exams list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamListResponse"
    post:
      operationId: createExam
      tags: [exams]
      summary: Create a new exam (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamInput"
      responses:
        "201":
          description: Created exam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"

  /v1/exams/{id}:
    get:
      operationId: getExam
      tags: [exams]
      summary: Get exam detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Exam detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateExam
      tags: [exams]
      summary: Update exam (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamUpdate"
      responses:
        "200":
          description: Updated exam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"
    delete:
      operationId: deleteExam
      tags: [exams]
      summary: Delete exam (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /v1/exams/{id}/stats:
    get:
      operationId: getExamStats
      tags: [exams]
      summary: Get aggregate stats for an exam (attempts, avg score, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Exam stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamStats"

  /v1/exams/{id}/collections:
    get:
      operationId: getExamCollections
      tags: [exams]
      summary: Get collections linked to an exam
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Linked collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionCollection"
    post:
      operationId: saveExamCollections
      tags: [exams]
      summary: Link collections to an exam
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveExamCollectionsInput"
      responses:
        "200":
          description: Collections linked successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, count]
                properties:
                  success:
                    type: boolean
                  count:
                    type: number

  /v1/exams/{id}/collections/{collectionId}:
    delete:
      operationId: removeExamCollection
      tags: [exams]
      summary: Unlink a collection from an exam
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: collectionId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Collection unlinked
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean

  /v1/exams/preview-collections:
    post:
      operationId: previewCollections
      tags: [exams]
      summary: Preview merged questions from multiple collections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewCollectionsInput"
      responses:
        "200":
          description: Preview of merged collections questions
          content:
            application/json:
              schema:
                type: object
                required: [totalQuestions, totalMarks, duplicatesRemoved, difficultyDistribution, collections, questions]
                properties:
                  totalQuestions:
                    type: number
                  totalMarks:
                    type: number
                  duplicatesRemoved:
                    type: number
                  difficultyDistribution:
                    type: object
                    required: [easy, medium, hard]
                    properties:
                      easy:
                        type: number
                      medium:
                        type: number
                      hard:
                        type: number
                  collections:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id:
                          type: number
                        name:
                          type: string
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Question"

  # ─── Subjects ────────────────────────────────────────────────────────────────
  /v1/subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: List all subjects
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
    post:
      operationId: createSubject
      tags: [subjects]
      summary: Create subject (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"

  # ─── Topics ──────────────────────────────────────────────────────────────────
  /v1/topics:
    get:
      operationId: listTopics
      tags: [topics]
      summary: List topics with optional subject filter
      parameters:
        - name: subjectId
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: Topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
    post:
      operationId: createTopic
      tags: [topics]
      summary: Create topic (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"

  # ─── Collections ─────────────────────────────────────────────────────────────
  /v1/collections:
    get:
      operationId: listCollections
      tags: [collections]
      summary: List all question collections
      parameters:
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            default: 20
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: isArchived
          in: query
          schema:
            type: ["boolean", "null"]
        - name: subjectId
          in: query
          schema:
            type: ["number", "null"]
        - name: topicId
          in: query
          schema:
            type: ["number", "null"]
        - name: difficulty
          in: query
          schema:
            type: ["string", "null"]
        - name: collectionType
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: sortBy
          in: query
          schema:
            type: ["string", "null"]
        - name: questionCountRange
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of collections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionCollectionListResponse"
    post:
      operationId: createCollection
      tags: [collections]
      summary: Create a new question collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionCollectionInput"
      responses:
        "201":
          description: Created collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionCollection"

  /v1/collections/{id}:
    get:
      operationId: getCollection
      tags: [collections]
      summary: Get details of a question collection including items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Collection details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionCollectionDetail"
    put:
      operationId: updateCollection
      tags: [collections]
      summary: Update a question collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionCollectionUpdate"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionCollection"
    delete:
      operationId: deleteCollection
      tags: [collections]
      summary: Delete a question collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Collection deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /v1/collections/{id}/items:
    post:
      operationId: updateCollectionItems
      tags: [collections]
      summary: Set/update the questions in a collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionItemsUpdateInput"
      responses:
        "200":
          description: Collection items updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: number

  /v1/collections/{id}/duplicate:
    post:
      operationId: duplicateCollection
      tags: [collections]
      summary: Duplicate a collection and its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "201":
          description: Duplicated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionCollection"

  /v1/collections/{id}/archive:
    post:
      operationId: archiveCollection
      tags: [collections]
      summary: Toggle archive status of a collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Archive status toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionCollection"

  /v1/collections/{id}/questions:
    get:
      operationId: getCollectionQuestions
      tags: [collections]
      summary: Get all questions inside a collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"

  # ─── Questions ───────────────────────────────────────────────────────────────
  /v1/questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: List questions with filters
      parameters:
        - name: subjectId
          in: query
          schema:
            type: ["number", "null"]
        - name: topicId
          in: query
          schema:
            type: ["number", "null"]
        - name: difficulty
          in: query
          schema:
            type: ["string", "null"]
            enum: [easy, medium, hard, null]
        - name: type
          in: query
          schema:
            type: ["string", "null"]
            enum: [single_choice, multiple_choice, true_false, integer, numerical, null]
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            default: 20
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Paginated questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionListResponse"
    post:
      operationId: createQuestion
      tags: [questions]
      summary: Create a new question (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"

  /v1/questions/{id}:
    get:
      operationId: getQuestion
      tags: [questions]
      summary: Get question detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
    put:
      operationId: updateQuestion
      tags: [questions]
      summary: Update question (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
    delete:
      operationId: deleteQuestion
      tags: [questions]
      summary: Delete question (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Test Sessions (Exam Engine) ─────────────────────────────────────────────
  /v1/sessions:
    post:
      operationId: startSession
      tags: [sessions]
      summary: Start a new exam session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionStartInput"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List current user's exam sessions
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

  /v1/sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get exam session state (for resuming)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"

  /v1/sessions/{id}/answer:
    patch:
      operationId: submitAnswer
      tags: [sessions]
      summary: Save/update answer for a question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: Answer saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /v1/sessions/{id}/submit:
    post:
      operationId: submitSession
      tags: [sessions]
      summary: Submit exam session and get result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"

  # ─── Results ─────────────────────────────────────────────────────────────────
  /v1/results:
    get:
      operationId: listResults
      tags: [results]
      summary: List current user's exam results
      parameters:
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultListResponse"

  /v1/results/{id}:
    get:
      operationId: getResult
      tags: [results]
      summary: Get detailed result with per-question analytics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Detailed result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultDetail"

  # ─── Leaderboard ─────────────────────────────────────────────────────────────
  /v1/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get leaderboard (weekly/monthly/overall)
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly, overall]
            default: overall

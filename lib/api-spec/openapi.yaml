                      targetAccuracy: { type: ["number", "null"] }
                  progress:
                    type: object
                    properties:
                      dailyQuestions: { type: number }
                      weeklyQuestions: { type: number }
                      monthlyQuestions: { type: number }
                      dailyHours: { type: number }

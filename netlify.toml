[build]
command = "pnpm install --frozen-lockfile && pnpm --filter @workspace/exam-platform build"
publish = "artifacts/exam-platform/dist"

[[redirects]]
  from = "/api/*"
  to = "https://rktechgovtwebsite.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200